# Dockhand-compatible git-stack compose file: point a Dockhand git stack at
# this repo with compose_path "compose.yaml" (repo root, so no context_dir
# override is needed) to deploy it. Works with plain `docker compose up -d`
# / `podman compose up -d` too.
#
# Pulls the multi-platform image docker/Dockerfile builds, published to
# ghcr.io/poag/discordweb by .github/workflows/docker-publish.yml on every
# push to main. If the pull comes back unauthorized, the GHCR package is
# still set to private - flip it to public under the package's own Settings
# on GitHub (Actions publishes packages private by default even for a
# public repo), or add registry credentials in Dockhand/docker login instead.
name: discordweb

services:
  discordweb:
    image: ghcr.io/poag/discordweb:latest
    container_name: discordweb
    restart: unless-stopped
    ports:
      - "8000:8000"
    # Uncomment and point these at your real voicelog/gamelog cog data
    # (Red's cog_data_path on whichever host runs the `redbot` container -
    # see the `cogs` repo) to replace the image's baked-in demo data. Each
    # host path must already exist before the container starts: Docker
    # silently creates an empty *directory* at a missing bind-mount source,
    # which then breaks the app since it expects a file there. Display
    # names live in these same two files (both cogs cache them
    # automatically), so no separate name-mapping file/volume is needed.
    # volumes:
    #   - /path/to/voicelog.sqlite3:/app/data/voicelog.sqlite3:ro
    #   - /path/to/gamelog.sqlite3:/app/data/gamelog.sqlite3:ro

    # Discord OAuth2 login (README "Authentication"). Leave all four unset
    # to keep the dashboard open with no login, same as before this existed.
    # Set all four together to require login and restrict each viewer to
    # the guilds they're actually a member of. Put real values in a `.env`
    # file next to this one (git-ignored) rather than editing them in here -
    # `docker compose`/Dockhand both load `.env` from the compose file's
    # directory automatically.
    # environment:
    #   DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
    #   DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
    #   DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI}
    #   SESSION_SECRET: ${SESSION_SECRET}
